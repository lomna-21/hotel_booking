spring.application.name=hotelbooking
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/hotel_booking?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=validate
# Show SQL in console — turn off in production
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# In production: store in environment variable, never hardcode here
app.jwt.secret=ThisIsALongAndReadableSecretKeyForSigningYourJWTTokensSecurely1!
# Token expiry: 86400000ms = 24 hours
app.jwt.expiration=86400000
# ■■ CORS ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
# Origins allowed to make cross-origin requests (your React/Angular frontend URLs)
app.cors.allowed-origins=http://localhost:3000,http://localhost:4200,http://localhost:5173
# ■■ BCRYPT ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
# BCrypt strength: number of rounds (10 = ~100ms, 12 = ~400ms)
# Higher = more secure, slower. 10-12 is standard
app.bcrypt.strength=10
