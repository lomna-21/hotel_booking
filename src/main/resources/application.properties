spring.application.name=hotelbooking
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/hotel_booking?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=validate
# Show SQL in console — turn off in production
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.jwt.secret=${JWT_SECRET}
# Token expiry: 86400000ms = 24 hours
app.jwt.expiration=86400000

# Origins allowed to make cross-origin requests
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:5175

# Higher = more secure, slower. 10-12 is standard
app.bcrypt.strength=10

# Gemini
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite:generateContent

