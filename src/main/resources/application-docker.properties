# DB — points to mysql service, same db name as local
spring.datasource.url=jdbc:mysql://mysql:3306/hotel_booking?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
